[package]
name = "aces-client"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", features = ["jpeg"] }
aces-protocol = { path = "../aces-protocol" }
aces-net = { path = "../aces-net" }
serde = { version = "1", features = ["derive"] }
# Flight logs (native) and the rig specs in the models' glTF extras.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
# Peer ids for tests that play a known local peer.
uuid = "1"
