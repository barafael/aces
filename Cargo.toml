[workspace]
members = ["aces-client", "aces-protocol", "aces-net"]
resolver = "3"

default-members = ["aces-client"]

# getrandom is never referenced in code: it exists so rand's wasm32 backend
# gets the `wasm_js` feature (see aces-net's wasm dependencies).
[workspace.metadata.cargo-shear]
ignored = ["getrandom"]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"

# Debug builds compile dependencies (bevy) with light optimization: the
# unoptimized debug wasm was ~1.4 GB and OOM-killed wasm-bindgen, and opt-1
# dependencies are dramatically faster to *run* in native dev too.
[profile.dev.package."*"]
opt-level = 1
