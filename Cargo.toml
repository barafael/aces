[workspace]
members = ["aces-client", "aces-protocol", "aces-net"]
resolver = "3"

default-members = ["aces-client"]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"

# Debug builds compile dependencies (bevy) with light optimization: the
# unoptimized debug wasm was ~1.4 GB and OOM-killed wasm-bindgen, and opt-1
# dependencies are dramatically faster to *run* in native dev too.
[profile.dev.package."*"]
opt-level = 1
